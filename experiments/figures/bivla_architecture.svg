<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#555"/>
    </marker>
    <marker id="arwG" markerWidth="10" markerHeight="8" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="600" fill="#ffffff"/>

  <!-- ================= Title & legend ================= -->
  <text x="30" y="32" font-size="19" font-weight="bold" fill="#222">Training-Free Test-Time Wrapper for VLA: Foveated Perception × Chunk Execution</text>
  <text x="30" y="54" font-size="12" font-style="italic" fill="#666">Two modules wrap a frozen, unmodified VLA backbone — nothing inside the backbone changes.</text>

  <rect x="1150" y="18" width="15" height="15" rx="3" fill="#FFF4DC" stroke="#E8B44C" stroke-width="1.5"/>
  <text x="1172" y="30" font-size="11" fill="#444">Ours — perception (input side)</text>
  <rect x="1150" y="40" width="15" height="15" rx="3" fill="#E6F4E6" stroke="#7CB342" stroke-width="1.5"/>
  <text x="1172" y="52" font-size="11" fill="#444">Ours — execution (output side)</text>
  <rect x="1150" y="62" width="15" height="15" rx="3" fill="#F0F1F3" stroke="#9AA0A6" stroke-width="1.5"/>
  <text x="1172" y="74" font-size="11" fill="#444">Frozen backbone (untouched)</text>

  <!-- ================= Input column ================= -->
  <rect x="30" y="60" width="160" height="60" rx="8" fill="#FBEFEF" stroke="#C98B8B" stroke-width="1.5"/>
  <text x="110" y="86" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">Language instruction</text>
  <text x="110" y="104" font-size="10" font-style="italic" fill="#666" text-anchor="middle">“put the carrot on the plate”</text>

  <rect x="42" y="152" width="160" height="110" rx="8" fill="#EDEDED" stroke="#BBB" stroke-width="1"/>
  <text x="192" y="164" font-size="9" fill="#888" text-anchor="end">o_t−1</text>
  <rect x="30" y="140" width="160" height="110" rx="8" fill="#E3ECF7" stroke="#6B9BD1" stroke-width="1.5"/>
  <text x="110" y="190" font-size="12" font-weight="bold" fill="#333" text-anchor="middle">RGB observation</text>
  <text x="110" y="208" font-size="11" fill="#555" text-anchor="middle">o_t (640×480)</text>

  <!-- instruction bypass: travels above both modules, drops in the gap, enters LLM bar directly -->
  <path d="M190,90 L595,90 L595,254 L630,254" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arw)"/>
  <!-- observation -> foveation module -->
  <path d="M190,195 L220,195" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ================= (1) Foveation module ================= -->
  <rect x="220" y="100" width="340" height="400" rx="12" fill="#FFF9EC" stroke="#E8B44C" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="390" y="124" font-size="14" font-weight="bold" fill="#8A6D1B" text-anchor="middle">① Foveated Perception — Ours</text>
  <text x="390" y="140" font-size="10" fill="#8A6D1B" text-anchor="middle">(training-free, applied to the image only)</text>

  <rect x="240" y="155" width="300" height="70" rx="8" fill="#FFF4DC" stroke="#E8B44C" stroke-width="1.5"/>
  <g stroke="#B58B2A" stroke-width="1.3" fill="none" opacity="0.85">
    <circle cx="278" cy="190" r="9"/><circle cx="278" cy="190" r="17"/><circle cx="278" cy="190" r="25"/>
  </g>
  <text x="278" y="194" font-size="7.5" fill="#8A6D1B" text-anchor="middle">gaze</text>
  <text x="410" y="182" font-size="11" font-weight="bold" fill="#5C4A12" text-anchor="middle">Motion Gaze</text>
  <text x="410" y="198" font-size="10" fill="#5C4A12" text-anchor="middle">frame-diff centroid + EMA → gaze center g_t</text>
  <text x="410" y="213" font-size="9.5" fill="#7A6420" text-anchor="middle">(fallback: image center)</text>

  <path d="M390,225 L390,235" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arwG)"/>

  <!-- branch A: log-polar (text only, no decorative icon) -->
  <rect x="240" y="235" width="145" height="95" rx="8" fill="#FFF4DC" stroke="#E8B44C" stroke-width="1.5"/>
  <text x="312" y="260" font-size="11.5" font-weight="bold" fill="#5C4A12" text-anchor="middle">Log-Polar Warp</text>
  <text x="312" y="282" font-size="9.5" fill="#7A6420" text-anchor="middle">moves pixels toward g_t</text>
  <text x="312" y="298" font-size="9.5" fill="#7A6420" text-anchor="middle">(mentor's original transform)</text>

  <!-- branch B: blur (text only) -->
  <rect x="395" y="235" width="145" height="95" rx="8" fill="#FFF4DC" stroke="#E8B44C" stroke-width="1.5"/>
  <text x="467" y="260" font-size="11.5" font-weight="bold" fill="#5C4A12" text-anchor="middle">Space-Variant Blur</text>
  <text x="467" y="282" font-size="9.5" fill="#7A6420" text-anchor="middle">pixels stay put,</text>
  <text x="467" y="298" font-size="9.5" fill="#7A6420" text-anchor="middle">periphery blurred only</text>

  <text x="390" y="350" font-size="10" font-style="italic" fill="#8A6D1B" text-anchor="middle">keep ratio ≈ 20% of full resolution (same info budget, either variant)</text>

  <rect x="240" y="365" width="300" height="54" rx="8" fill="#FFF4DC" stroke="#E8B44C" stroke-width="1.5"/>
  <text x="390" y="387" font-size="11.5" font-weight="bold" fill="#5C4A12" text-anchor="middle">Phase Gate (optional)</text>
  <text x="390" y="405" font-size="10" fill="#5C4A12" text-anchor="middle">foveate while gripper OPEN → full-res after grasp</text>

  <!-- foveated image -> vision encoder -->
  <path d="M540,255 L578,255 L578,160 L610,160" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="590" y="145" font-size="10" font-style="italic" fill="#555" text-anchor="middle">ô_t</text>

  <!-- ================= Frozen backbone ================= -->
  <rect x="610" y="100" width="250" height="400" rx="12" fill="#F0F1F3" stroke="#9AA0A6" stroke-width="2"/>
  <text x="735" y="124" font-size="14" font-weight="bold" fill="#4A4E54" text-anchor="middle">Frozen VLA Backbone ❄</text>
  <text x="735" y="140" font-size="10" fill="#6A6E74" text-anchor="middle">weights untouched — zero training, zero extra modules</text>

  <rect x="630" y="150" width="210" height="50" rx="7" fill="#DCE9F8" stroke="#6B9BD1" stroke-width="1.5"/>
  <text x="735" y="180" font-size="11.5" font-weight="bold" fill="#2F4A66" text-anchor="middle">Vision Encoder</text>

  <path d="M735,200 L735,212" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arwG)"/>
  <rect x="630" y="214" width="210" height="76" rx="7" fill="#FDE7CE" stroke="#E8A15C" stroke-width="1.5"/>
  <text x="735" y="246" font-size="12.5" font-weight="bold" fill="#7A4A14" text-anchor="middle">LLM Backbone</text>
  <text x="735" y="264" font-size="9.5" fill="#8A5E2A" text-anchor="middle">(fuses vision + language tokens)</text>

  <path d="M735,290 L735,302" fill="none" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arwG)"/>
  <rect x="630" y="304" width="210" height="50" rx="7" fill="#EADCF8" stroke="#9C6BD1" stroke-width="1.5"/>
  <text x="735" y="334" font-size="11.5" font-weight="bold" fill="#4A2E6E" text-anchor="middle">Action Decoder</text>

  <text x="735" y="405" font-size="10.5" font-weight="bold" fill="#4A4E54" text-anchor="middle">backbone-agnostic</text>
  <text x="735" y="422" font-size="10" fill="#666" text-anchor="middle">any pretrained VLA checkpoint</text>
  <text x="735" y="438" font-size="10" fill="#666" text-anchor="middle">(OpenVLA · SpatialVLA · UniVLA)</text>

  <!-- action chunk -> chunk exec -->
  <path d="M840,329 L900,329" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="870" y="321" font-size="10" font-style="italic" fill="#555" text-anchor="middle">action chunk</text>

  <!-- ================= (2) Chunk-exec module ================= -->
  <rect x="870" y="100" width="260" height="400" rx="12" fill="#F3FAF3" stroke="#7CB342" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="1000" y="124" font-size="14" font-weight="bold" fill="#3E6B2A" text-anchor="middle">② Chunk-Exec — Ours</text>
  <text x="1000" y="140" font-size="10" fill="#3E6B2A" text-anchor="middle">(reuse the future actions already predicted)</text>

  <text x="1000" y="160" font-size="10" fill="#3E6B2A" text-anchor="middle">one forward pass predicts:</text>
  <rect x="890" y="168" width="48" height="34" rx="5" fill="#CDEBC9" stroke="#4C8C3F" stroke-width="1.5"/>
  <text x="914" y="189" font-size="10.5" font-weight="bold" fill="#2E5A22" text-anchor="middle">a_t</text>
  <rect x="944" y="168" width="48" height="34" rx="5" fill="#CDEBC9" stroke="#4C8C3F" stroke-width="1.5"/>
  <text x="968" y="189" font-size="10.5" font-weight="bold" fill="#2E5A22" text-anchor="middle">a_t+1</text>
  <rect x="998" y="168" width="48" height="34" rx="5" fill="#F2F2F2" stroke="#AAA" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1022" y="189" font-size="10.5" fill="#999" text-anchor="middle">a_t+2</text>
  <rect x="1052" y="168" width="48" height="34" rx="5" fill="#F2F2F2" stroke="#AAA" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1076" y="189" font-size="10.5" fill="#999" text-anchor="middle">a_t+3</text>

  <path d="M890,210 L992,210" stroke="#4C8C3F" stroke-width="1.5" fill="none"/>
  <text x="941" y="226" font-size="10" font-weight="bold" fill="#2E5A22" text-anchor="middle">execute (k = 2)</text>
  <text x="1049" y="226" font-size="9" fill="#999" text-anchor="middle">discard → re-plan</text>

  <rect x="890" y="240" width="220" height="76" rx="8" fill="#E6F4E6" stroke="#7CB342" stroke-width="1.5"/>
  <text x="1000" y="262" font-size="11.5" font-weight="bold" fill="#2E5A22" text-anchor="middle">Sequential Executor</text>
  <text x="1000" y="280" font-size="10.5" fill="#2E5A22" text-anchor="middle">k actions per model call</text>
  <text x="1000" y="298" font-size="10.5" fill="#2E5A22" text-anchor="middle">→ ½ forward calls, ≈2× lower latency</text>

  <text x="1000" y="340" font-size="9.5" font-style="italic" fill="#4C8C3F" text-anchor="middle">t+1 uses a_t+1 predicted at t —</text>
  <text x="1000" y="356" font-size="9.5" font-style="italic" fill="#4C8C3F" text-anchor="middle">no forward pass, no extra module</text>

  <!-- executor -> env -->
  <path d="M1130,278 L1160,278" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arw)"/>

  <!-- ================= Environment ================= -->
  <rect x="1170" y="200" width="170" height="260" rx="12" fill="#FDF3F3" stroke="#C98B8B" stroke-width="2"/>
  <text x="1255" y="226" font-size="12.5" font-weight="bold" fill="#7A3E3E" text-anchor="middle">WidowX Robot</text>
  <text x="1255" y="242" font-size="10" fill="#7A3E3E" text-anchor="middle">SimplerEnv Bridge</text>
  <g stroke="#A66" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="1230" y1="345" x2="1280" y2="345"/>
    <path d="M1255,345 L1245,312 L1270,292"/>
    <path d="M1270,292 L1279,285"/>
    <path d="M1270,292 L1279,299"/>
  </g>
  <circle cx="1255" cy="345" r="3.2" fill="#A66"/>
  <circle cx="1245" cy="312" r="3.2" fill="#A66"/>
  <circle cx="1270" cy="292" r="3.2" fill="#A66"/>
  <text x="1255" y="405" font-size="9.5" fill="#7A3E3E" text-anchor="middle">carrot · spoon</text>
  <text x="1255" y="420" font-size="9.5" fill="#7A3E3E" text-anchor="middle">stack · eggplant</text>

  <!-- feedback: gripper state -> phase gate -->
  <path d="M1220,460 L1220,528 L390,528 L390,419" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arwG)"/>
  <text x="805" y="522" font-size="10" font-style="italic" fill="#777" text-anchor="middle">gripper open/close command (policy's own signal — no oracle)</text>

  <!-- feedback: next obs -->
  <path d="M1290,460 L1290,558 L110,558 L110,250" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arwG)"/>
  <text x="700" y="552" font-size="10" font-style="italic" fill="#777" text-anchor="middle">next observation o_t+1</text>
</svg>
