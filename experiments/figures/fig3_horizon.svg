<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1040" height="600" fill="#ffffff"/>
<text x="30" y="42" font-size="24" font-weight="600" fill="#1a1a19">Each policy is best near the horizon it was trained to execute</text>
<text x="30" y="66" font-size="13" fill="#52514e">Open-loop horizon = environment steps executed per model call. Action repeat is the only temporal operation that exists</text>
<text x="30" y="84" font-size="13" fill="#52514e">identically on every backbone, so it is what varies the horizon here. SimplerEnv WidowX-Bridge, 96 episodes per point.</text>
