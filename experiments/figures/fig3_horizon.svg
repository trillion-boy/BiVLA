<text x="684.6" y="164.3" font-size="11" fill="#52514e" text-anchor="middle">peak at 0.5×, not 1×</text>
<text x="30" y="490" font-size="11.5" fill="#52514e">Two backbones peak exactly at their trained length; SpatialVLA peaks below it. Action repeat holds one action for k steps, which is</text>
<text x="30" y="506" font-size="11.5" fill="#52514e">not the same operation as executing a k-step chunk — so the x-axis is comparable across backbones, the mechanism behind it is not.</text>
<text x="30" y="530" font-size="11" fill="#8a8a85">In panel A the dashed vertical tick, drawn in each curve’s own colour, marks that policy’s trained chunk length. In panel B OpenVLA</text>
<text x="30" y="546" font-size="11" fill="#8a8a85">and UniVLA are deployed at 1× by construction, so both sit at 0 there; SpatialVLA is the only backbone with points on both sides of</text>
<text x="30" y="562" font-size="11" fill="#8a8a85">the line.</text>
</svg>