<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 240 260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <g fill="none" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- pedestal: flat foot, stand, rotating disc -->
    <line x1="85" y1="236" x2="155" y2="236"/>
    <line x1="120" y1="236" x2="120" y2="207"/>
    <ellipse cx="120" cy="197" rx="42" ry="10"/>

    <!-- arm: shoulder -> elbow -> wrist, zig-zag with ball joints -->
    <line x1="120" y1="188" x2="93" y2="142"/>
    <line x1="93" y1="142" x2="140" y2="110"/>
    <line x1="140" y1="110" x2="165" y2="84"/>

    <!-- gripper: two prongs opening from the wrist, each with a small perpendicular pad -->
    <line x1="165" y1="84" x2="188" y2="66"/>
    <line x1="165" y1="84" x2="184" y2="100"/>
    <line x1="181" y1="59" x2="196" y2="73"/>
    <line x1="177" y1="107" x2="192" y2="93"/>
  </g>

  <!-- joints drawn as hollow circles sitting on top of the strokes -->
  <g fill="#ffffff" stroke="#2b2b2b" stroke-width="4.5">
    <circle cx="120" cy="188" r="7"/>
    <circle cx="93" cy="142" r="7"/>
    <circle cx="140" cy="110" r="7"/>
    <circle cx="165" cy="84" r="6"/>
  </g>
</svg>
