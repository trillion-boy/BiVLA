<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480"
     role="img" aria-label="Three intervention points on a frozen VLA control loop: fixed foveation on the observation before the policy, fixed depth pruning inside the LLM decoder stack, and action repeat on the action array before the environment steps.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    .lbl   { font-family: "Helvetica Neue", Arial, sans-serif; fill: #1f2937; }
    .t14   { font-size: 14px; font-weight: 600; }
    .t12   { font-size: 12px; }
    .t11   { font-size: 11px; }
    .t10   { font-size: 10px; }
    .mut   { fill: #6b7280; }
    .acc   { fill: #b45309; }
    .accb  { font-weight: 600; fill: #b45309; }
    .box   { fill: #ffffff; stroke: #1f2937; stroke-width: 1.4; }
    .frz   { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.4; }
    .sub   { fill: #ffffff; stroke: #6b7280; stroke-width: 1.2; }
    .hook  { fill: #fffbeb; stroke: #d97706; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .flow  { stroke: #1f2937; stroke-width: 1.6; fill: none; }
    .fb    { stroke: #6b7280; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
  </style>

  <!-- ============ inputs ============ -->
  <rect class="box" x="20" y="140" width="112" height="70" rx="4"/>
  <text class="lbl t12" x="76" y="168" text-anchor="middle">RGB frame</text>
  <text class="lbl t10 mut" x="76" y="185" text-anchor="middle">from the env</text>
  <text class="lbl t10 mut" x="76" y="198" text-anchor="middle">camera</text>

  <rect class="box" x="20" y="250" width="112" height="48" rx="4"/>
  <text class="lbl t12" x="76" y="279" text-anchor="middle">Instruction</text>

  <!-- ============ HOOK A ============ -->
  <rect class="hook" x="170" y="118" width="150" height="114" rx="6"/>
  <text class="lbl t12 accb" x="245" y="139" text-anchor="middle">① Fixed foveation</text>
  <!-- degraded periphery / sharp centre -->
  <rect x="212" y="152" width="66" height="52" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <rect x="232" y="166" width="26" height="24" fill="#ffffff" stroke="#b45309" stroke-width="1.4"/>
  <text class="lbl t10 mut" x="245" y="219" text-anchor="middle">sharp centre, degraded edge</text>
  <text class="lbl t10 accb" x="245" y="110" text-anchor="middle">HOOK A · the observation</text>

  <!-- ============ frozen backbone ============ -->
  <rect class="frz" x="352" y="100" width="248" height="290" rx="6"/>
  <text class="lbl t14" x="476" y="124" text-anchor="middle">Frozen VLA backbone</text>
  <text class="lbl t10 mut" x="476" y="140" text-anchor="middle">no training, no added modules</text>

  <rect class="sub" x="374" y="155" width="204" height="34" rx="3"/>
  <text class="lbl t12" x="476" y="177" text-anchor="middle">Vision encoder</text>

  <rect class="sub" x="374" y="212" width="204" height="98" rx="3"/>
  <text class="lbl t11" x="384" y="230">LLM decoder stack</text>

  <!-- decoder layers; #2 and #4 bypassed -->
  <rect x="390" y="248" width="20" height="22" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <rect x="421" y="248" width="20" height="22" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 2"/>
  <rect x="452" y="248" width="20" height="22" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <rect x="483" y="248" width="20" height="22" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="3 2"/>
  <rect x="514" y="248" width="20" height="22" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <rect x="545" y="248" width="20" height="22" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <!-- skip arcs over the bypassed layers -->
  <path d="M416,248 Q431,228 446,248" stroke="#b45309" stroke-width="1.5" fill="none" marker-end="url(#ara)"/>
  <path d="M478,248 Q493,228 508,248" stroke="#b45309" stroke-width="1.5" fill="none" marker-end="url(#ara)"/>
  <text class="lbl t10 accb" x="476" y="292" text-anchor="middle">③ bypass the N most redundant layers</text>

  <rect class="sub" x="374" y="332" width="204" height="34" rx="3"/>
  <text class="lbl t12" x="476" y="354" text-anchor="middle">Action decoder</text>

  <text class="lbl t10 accb" x="600" y="304" text-anchor="end">HOOK C</text>

  <!-- ============ HOOK B ============ -->
  <rect class="hook" x="638" y="300" width="150" height="102" rx="6"/>
  <text class="lbl t12 accb" x="713" y="322" text-anchor="middle">② Action repeat</text>
  <rect x="654" y="336" width="30" height="24" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
  <text class="lbl t11" x="669" y="353" text-anchor="middle">a</text>
  <path class="flow" d="M688,348 L702,348" marker-end="url(#ar)"/>
  <rect x="708" y="336" width="30" height="24" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text class="lbl t11 acc" x="723" y="353" text-anchor="middle">a</text>
  <rect x="742" y="336" width="30" height="24" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text class="lbl t11 acc" x="757" y="353" text-anchor="middle">a</text>
  <text class="lbl t10 mut" x="713" y="379" text-anchor="middle">hold it for N env steps</text>
  <text class="lbl t10 accb" x="713" y="292" text-anchor="middle">HOOK B · the action</text>

  <!-- ============ environment ============ -->
  <rect class="box" x="838" y="316" width="132" height="70" rx="4"/>
  <text class="lbl t12" x="904" y="344" text-anchor="middle">Simulator</text>
  <text class="lbl t10 mut" x="904" y="361" text-anchor="middle">env.step()</text>
  <text class="lbl t10 mut" x="904" y="374" text-anchor="middle">raw, unmodified scene</text>

  <!-- ============ flow ============ -->
  <path class="flow" d="M132,175 L164,175" marker-end="url(#ar)"/>
  <path class="flow" d="M320,175 L346,175" marker-end="url(#ar)"/>
  <text class="lbl t10 mut" x="333" y="165" text-anchor="middle"> </text>
  <path class="flow" d="M132,274 L346,274" marker-end="url(#ar)"/>
  <path class="flow" d="M476,189 L476,208" marker-end="url(#ar)"/>
  <path class="flow" d="M476,310 L476,328" marker-end="url(#ar)"/>
  <path class="flow" d="M578,349 L632,349" marker-end="url(#ar)"/>
  <text class="lbl t10 mut" x="605" y="340" text-anchor="middle">1 action</text>
  <path class="flow" d="M788,351 L832,351" marker-end="url(#ar)"/>
  <text class="lbl t10 mut" x="810" y="342" text-anchor="middle">N steps</text>

  <!-- feedback -->
  <path class="fb" d="M904,386 L904,440 L76,440 L76,216" marker-end="url(#ar)"/>
  <text class="lbl t10 mut" x="490" y="434" text-anchor="middle">next observation</text>

  <!-- ============ note ============ -->
  <rect x="20" y="34" width="500" height="40" rx="4" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text class="lbl t11" x="34" y="51">Three of the four conditions attach here. The fourth, <tspan font-weight="600">Original policy</tspan>, is the same loop with all three off.</text>
  <text class="lbl t10 mut" x="34" y="66">Every hook attaches outside the frozen weights, at a point that exists in any VLA.</text>
</svg>
