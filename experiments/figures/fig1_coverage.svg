<text x="30" y="72" font-size="13.5" fill="#52514e">Change in success rate against each backbone’s own baseline.</text>
<text x="30" y="90" font-size="13.5" fill="#52514e">Bridge columns: 4 tasks × 24 = 96 matched pairs per condition. Fractal column: 135. Frozen weights throughout.</text>
