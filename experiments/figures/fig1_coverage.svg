<text x="30" y="427" font-size="11.5" fill="#52514e">hold for 4 env steps</text>
<rect x="269" y="389" width="136" height="48" rx="4" fill="#d03b3b"/>
<text x="337" y="415" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">−11.5</text>
<rect x="332.8" y="423" width="8" height="8" fill="#1a1a19"/>
<rect x="419" y="389" width="136" height="48" rx="4" fill="#d03b3b"/>
