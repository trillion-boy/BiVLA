<circle cx="542.5" cy="427" r="3.6" fill="none" stroke="#52514e" stroke-width="1.4"/>
<text x="730" y="418" font-size="13" fill="#8a8a85" text-anchor="middle">not run</text>
<text x="916" y="418" font-size="13" fill="#8a8a85" text-anchor="middle">not run</text>
<line x1="30" y1="444" x2="1010" y2="444" stroke="#d8d7d2" stroke-width="1"/>
<text x="30" y="471" font-size="14.5" font-weight="600" fill="#1a1a19">Fixed depth pruning</text>
<text x="30" y="489" font-size="11.5" fill="#52514e">bypass redundant layers</text>
<rect x="269" y="451" width="173" height="48" rx="4" fill="#f0efec"/>
<text x="356" y="477" font-size="20" font-weight="600" fill="#1a1a19" text-anchor="middle">+1.0</text>
<circle cx="355.5" cy="489" r="3.6" fill="none" stroke="#52514e" stroke-width="1.4"/>
<rect x="456" y="451" width="173" height="48" rx="4" fill="#ea9a9a"/>
<text x="542" y="477" font-size="20" font-weight="600" fill="#1a1a19" text-anchor="middle">−9.4</text>
<rect x="538.5" y="485" width="8" height="8" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="2.2 1.8"/>
<text x="730" y="480" font-size="13" fill="#8a8a85" text-anchor="middle">not run</text>
<text x="916" y="480" font-size="13" fill="#8a8a85" text-anchor="middle">not run</text>
<line x1="30" y1="506" x2="1010" y2="506" stroke="#1a1a19" stroke-width="1.2"/>
<rect x="31" y="526" width="8" height="8" fill="#1a1a19"/>
<text x="46" y="534" font-size="11" fill="#52514e">paired McNemar, clears Bonferroni (α≈0.003)</text>
<circle cx="297.65" cy="530" r="4" fill="#1a1a19"/>
<text x="308.65" y="534" font-size="11" fill="#52514e">paired McNemar, p &lt; 0.05</text>
<circle cx="454.84999999999997" cy="530" r="3.6" fill="none" stroke="#52514e" stroke-width="1.4"/>
<text x="465.84999999999997" y="534" font-size="11" fill="#52514e">paired, not distinguishable from chance</text>
<rect x="691.3" y="526" width="8" height="8" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="2.2 1.8"/>
<text x="706.3" y="534" font-size="11" fill="#52514e">earlier campaign — no per-episode records, unpaired only</text>
<text x="30" y="576" font-size="16" font-weight="600" fill="#1a1a19">What the grid says</text>
<circle cx="41" cy="607" r="11" fill="#1a1a19"/>
<text x="41" y="611.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="62" y="611" font-size="14" font-weight="600" fill="#1a1a19">The same intervention reverses sign across backbones.</text>
<text x="62" y="631" font-size="12.5" fill="#52514e">Action repeat 2 costs UniVLA 70.8 points and gains SpatialVLA 12.5. Identical code, identical hook, opposite direction</text>
<text x="62" y="647" font-size="12.5" fill="#52514e">— so this is not a difference of degree that a better default would smooth out.</text>
<circle cx="41" cy="689" r="11" fill="#1a1a19"/>
<text x="41" y="693.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="62" y="693" font-size="14" font-weight="600" fill="#1a1a19">Damage tracks distance from the trained execution length, not the horizon.</text>
<text x="62" y="713" font-size="12.5" fill="#52514e">OpenVLA (k=1) and UniVLA (k=5) are both already at their trained length and only lose by moving. SpatialVLA is the one</text>
<text x="62" y="729" font-size="12.5" fill="#52514e">backbone deployed below its own chunk, and it is the one that gains. See Figure 3.</text>
<circle cx="41" cy="771" r="11" fill="#1a1a19"/>
<text x="41" y="775.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="62" y="775" font-size="14" font-weight="600" fill="#1a1a19">Foveation is both the largest gain and the largest loss we measured.</text>
<text x="62" y="795" font-size="12.5" fill="#52514e">+18.8 on OpenVLA, −19.8 on RoboVLMs. The backbones that lose have something for it to break — explicit 3D position</text>
<text x="62" y="811" font-size="12.5" fill="#52514e">encoding, or a latent compression bottleneck; the ones that gain have neither.</text>
<circle cx="41" cy="853" r="11" fill="#1a1a19"/>
<text x="41" y="857.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="62" y="857" font-size="14" font-weight="600" fill="#1a1a19">Depth pruning looks free on the mean and is not free per task.</text>
<text x="62" y="877" font-size="12.5" fill="#52514e">OpenVLA's aggregate moves +1.0 (p≥0.80) while eggplant goes 25.0 → 58.3 and the other three fall. Pruning buys</text>
<text x="62" y="893" font-size="12.5" fill="#52514e">decisiveness and spends precision; the mean hides the trade.</text>
</svg>