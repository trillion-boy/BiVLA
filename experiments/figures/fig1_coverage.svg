<text x="786" y="181" font-size="10" fill="#8a8a85" text-anchor="middle">LSTM state, k=10</text>
<text x="935" y="136" font-size="16" font-weight="600" fill="#1a1a19" text-anchor="middle">SpatialVLA</text>
