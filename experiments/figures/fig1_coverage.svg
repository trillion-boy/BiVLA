<text x="542" y="169" font-size="10" fill="#8a8a85" text-anchor="middle">chunk head</text>
<text x="542" y="181" font-size="10" fill="#8a8a85" text-anchor="middle">trained k~4</text>
<text x="730" y="136" font-size="16" font-weight="600" fill="#1a1a19" text-anchor="middle">UniVLA</text>
<text x="730" y="154" font-size="11.5" fill="#52514e" text-anchor="middle">baseline 78.1%</text>
<text x="730" y="169" font-size="10" fill="#8a8a85" text-anchor="middle">native chunk</text>
<text x="730" y="181" font-size="10" fill="#8a8a85" text-anchor="middle">trained k=5</text>
<text x="916" y="136" font-size="16" font-weight="600" fill="#1a1a19" text-anchor="middle">RoboVLMs</text>
<text x="916" y="154" font-size="11.5" fill="#52514e" text-anchor="middle">baseline 39.6%</text>
<text x="916" y="169" font-size="10" fill="#8a8a85" text-anchor="middle">LSTM state</text>
<text x="916" y="181" font-size="10" fill="#8a8a85" text-anchor="middle">trained k=10</text>
