<text x="916" y="291" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">−16.7</text>
<rect x="912.5" y="299" width="8" height="8" fill="none" stroke="#52514e" stroke-width="1.3" stroke-dasharray="2.2 1.8"/>
<line x1="30" y1="320" x2="1010" y2="320" stroke="#d8d7d2" stroke-width="1"/>
<text x="30" y="347" font-size="14.5" font-weight="600" fill="#1a1a19">Action repeat</text>
<text x="30" y="365" font-size="11.5" fill="#52514e">hold for 2 env steps</text>
<rect x="269" y="327" width="173" height="48" rx="4" fill="#ea9a9a"/>
