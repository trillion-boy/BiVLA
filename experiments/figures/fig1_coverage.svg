<line x1="30" y1="444" x2="1010" y2="444" stroke="#d8d7d2" stroke-width="1"/>
<text x="30" y="471" font-size="14.5" font-weight="600" fill="#1a1a19">Fixed depth pruning</text>
<text x="30" y="489" font-size="11.5" fill="#52514e">bypass redundant layers</text>
<rect x="269" y="451" width="136" height="48" rx="4" fill="#f0efec"/>
