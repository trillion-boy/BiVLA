<text x="486" y="181" font-size="10" fill="#8a8a85" text-anchor="middle">chunk head, k~4</text>
<text x="636" y="136" font-size="16" font-weight="600" fill="#1a1a19" text-anchor="middle">UniVLA</text>
<text x="636" y="154" font-size="11.5" fill="#52514e" text-anchor="middle">baseline 78.1%</text>
