<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 956" width="1040" height="956" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1040" height="956" fill="#ffffff"/>
<text x="30" y="46" font-size="26" font-weight="600" fill="#1a1a19">One intervention, four backbones, opposite answers</text>
